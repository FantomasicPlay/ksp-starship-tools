<!doctype html>
<meta charset="utf-8">
<title>KSP Overlay — песочница</title>
<script>
// Точка входа в режим песочницы. Сам режим живёт внутри index.html и
// включается флагом ?sandbox=1 - так UI и стенд не могут разойтись.
location.replace("index.html?sandbox=1" + location.hash);
</script>
<p style="font:14px system-ui;padding:20px">
Открываю <a href="index.html?sandbox=1">index.html?sandbox=1</a>…
</p>
